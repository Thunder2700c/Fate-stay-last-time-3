<style>
:root{--bg:#131110;--line:#2e2823;--ink:#ece5d8;--muted:#a3988a;--dim:#6f6558;--crimson:#d43a2f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
main{max-width:460px}
.disc{position:relative;width:150px;height:150px;margin:0 auto 30px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#191614 0 2px,#211d1a 2px 4px);box-shadow:inset 0 0 0 1px #2a2420;animation:spin 6s linear infinite}
.disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:var(--ink)}
.disc::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--bg);z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.cat{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.4em;color:var(--crimson)}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:12px 0 14px}
p{color:var(--muted);font-size:15px;margin-bottom:28px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;height:46px;padding:0 22px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:background .2s,border-color .2s}
.solid{background:var(--crimson);color:var(--ink)}.solid:hover{background:#e0483c}
.ghost{border:1px solid var(--line);color:var(--muted)}.ghost:hover{border-color:var(--crimson);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
</style>

<body>
<main>
